name: Daily MBTI x Saju Reel & Shorts Automation

on:
  schedule:
    # 매일 17:50 KST (08:50 UTC)에 시작해 영상을 만들고, 게시 직전에 18:30 KST까지 대기 후 공개.
    # GitHub 스케줄 지연(최대 ~2시간)을 대기 시간으로 흡수. 목표 시각 +2h를 넘기거나 새벽이면 게시 건너뜀.
    - cron: '50 8 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '특정 주제 지정 (비워두면 자동 바이럴 기획)'
        required: false
        default: ''
      youtube_schedule:
        description: 'YouTube Shorts KST 예약 공개 시각 (기본 18:30, none 입력 시 즉시 공개)'
        required: false
        default: '18:30'

jobs:
  generate_and_publish:
    name: Generate & Publish Reel/Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk
          mkdir -p ~/.fonts
          cp assets/fonts/* ~/.fonts/ 2>/dev/null || true
          fc-cache -f -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GCP_LOCATION: ${{ secrets.GCP_LOCATION || 'us-central1' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_BGM_FOLDER_ID: ${{ secrets.GDRIVE_BGM_FOLDER_ID }}
          IMAGE_ENGINE: gemini
          GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
          USE_GOOGLE_FLOW: 'false'
          # 훅(제목/훅/씬1 음성)에서 출생연도·띠, MBTI 4글자 호명 금지 (ig-audit: 정체성 호명 훅은 조회가 낮았음)
          HOOK_BAN_BIRTHYEAR: 'true'
          HOOK_BAN_MBTI: 'true'
          # 입력값은 env로 전달 (셸 인젝션/따옴표 문제 방지)
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_YT_SCHEDULE: ${{ github.event.inputs.youtube_schedule }}
        run: |
          ARGS=()
          if [ -n "$INPUT_TOPIC" ]; then
            ARGS+=(--topic "$INPUT_TOPIC")
          fi
          if [ -n "$INPUT_YT_SCHEDULE" ]; then
            ARGS+=(--youtube-schedule-kst "$INPUT_YT_SCHEDULE")
          fi
          python -m pipeline.auto_runner "${ARGS[@]}"

