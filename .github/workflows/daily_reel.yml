name: Daily MBTI x Saju Reel & Shorts Automation

on:
  schedule:
    # 매일 17:30 KST (17:30 KST = 08:30 UTC)
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: '특정 주제 지정 (비워두면 자동 바이럴 기획)'
        required: false
        default: ''

jobs:
  generate_and_publish:
    name: Generate & Publish Reel/Shorts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Korean Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum fonts-noto-cjk
          mkdir -p ~/.fonts
          cp assets/fonts/* ~/.fonts/ 2>/dev/null || true
          fc-cache -f -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GCP_LOCATION: ${{ secrets.GCP_LOCATION || 'us-central1' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_BGM_FOLDER_ID: ${{ secrets.GDRIVE_BGM_FOLDER_ID }}
          IMAGE_ENGINE: gemini
          GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
          USE_GOOGLE_FLOW: 'false'
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python -m pipeline.auto_runner --topic "${{ github.event.inputs.topic }}"
          else
            python -m pipeline.auto_runner
          fi

