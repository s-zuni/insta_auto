name: Daily Threads Automation

on:
  schedule:
    # 하루 3회 최적 시간대 분산 발행 (정각/30분 GitHub 대기열 병목 회피를 위해 25분/35분 설정)
    # 1. 아침 출근길: 08:25 KST (전날 23:25 UTC)
    - cron: '25 23 * * *'
    # 2. 점심 휴식시간: 13:25 KST (04:25 UTC)
    - cron: '25 4 * * *'
    # 3. 저녁 퇴근길: 18:35 KST (09:35 UTC, 릴스 게시 직후)
    - cron: '35 9 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: '시간대 슬롯 (auto/morning/afternoon/evening)'
        required: false
        default: 'auto'
      category:
        description: '카테고리 선택 (비워두면 사주60%/MBTI20%/운세20% 가중 자동)'
        required: false
        default: ''
      with_cta:
        description: 'mbtiju.com 전환 CTA 답글 강제 포함 여부'
        type: boolean
        default: false

jobs:
  publish_thread:
    name: Generate & Publish Threads Post
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Threads Automated Publisher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.slot }}" ] && [ "${{ github.event.inputs.slot }}" != "auto" ]; then
            ARGS="$ARGS --slot ${{ github.event.inputs.slot }}"
          fi
          if [ -n "${{ github.event.inputs.category }}" ]; then
            ARGS="$ARGS --category ${{ github.event.inputs.category }}"
          fi
          if [ "${{ github.event.inputs.with_cta }}" = "true" ]; then
            ARGS="$ARGS --with-cta"
          fi
          python -m pipeline.threads_runner $ARGS

